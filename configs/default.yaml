dataset:
  cache_dir: data/cache
  limit: null               # set an int to run on the first N problems only


llm:
  provider: openai          # openai (Responses API) | fptcloud (Chat Completions)
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-6-luna
  reasoning_mode: standard  # Responses API only; ignored by fptcloud
  reasoning_effort: medium  # null to omit it, e.g. for models without reasoning
  max_output_tokens: 32768
  timeout_s: 1800
  max_retries: 5            # SDK retries connection errors
  cost_per_1k_input: null   # USD per 1k tokens; required (0.0 if free) so cost is never a silent $0
  cost_per_1k_output: null

# Build/test/time against the -O3 baseline (Linux x86-64 only). Keep identical across the
# methods being compared; each run records the values it used in config.json.
eval:
  cc: gcc
  link_flags: [-lm]
  compile_timeout_s: 30
  run_timeout_s: 10
  memory_limit_mb: 1024
  hyperfine: hyperfine      # timing tool; per test input it discards 3 runs, averages 10
  warmup_runs: 3
  timing_repeats: 10
  workers: 8                # parallel problems; each times baseline and candidate interleaved

run:
  workers: 16               # concurrent LLM calls
  output_dir: runs

# Same budget for every search method so RQ2 compares them fairly.
search:
  max_candidates: 12        # LLM-made candidates per (problem, seed), repairs and failures included
  population_size: 4        # evolution: baseline + best valid candidates
  offspring_per_generation: 4
  generations: 3
  tournament_size: 2
  seeds: [0, 1, 2]

split:
  seed: 0
  dev_fraction: 0.2         # problems used to tune prompts/config; the rest is the test split
  heldout_fraction: 0.3     # per problem, test inputs kept for the final check only
